<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People labeling — CCW</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg: #ebebeb; --dim: #8a8a8a; --out: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: var(--fg); font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; color: var(--dim); }
  header b { color: var(--fg); font-weight: 400; }
  .bar { width: 220px; height: 2px; background: #222; }
  .bar i { display: block; height: 100%; background: var(--fg); width: 0; transition: width .3s var(--out); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; width: 100%; }
  .card { position: absolute; height: min(68vh, 640px); aspect-ratio: 1288 / 1600; background: #111 center / cover no-repeat;
    box-shadow: 0 20px 60px rgba(0,0,0,.8); transition: transform .45s var(--out), opacity .45s var(--out); }
  .card.out { opacity: 0; }
  .meta { position: absolute; bottom: -46px; left: 0; right: 0; text-align: center; color: var(--dim); font-size: 12px; }
  .meta b { color: var(--fg); font-weight: 400; }
  .stamp { position: absolute; top: 18px; left: 50%; translate: -50% 0; padding: 4px 12px; border: 2px solid var(--fg); border-radius: 4px;
    font-size: 20px; letter-spacing: .04em; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .15s; }
  .card.stamped .stamp { opacity: 1; }
  footer { display: flex; gap: 8px; padding: 70px 0 28px; }
  footer button { background: #111; color: var(--fg); border: 1px solid #2a2a2a; border-radius: 999px; padding: 10px 16px; font: inherit; cursor: pointer;
    transition: background .2s, border-color .2s; }
  footer button:hover, footer button.hint { border-color: #777; }
  footer button.hit { background: var(--fg); color: #000; }
  footer kbd { color: var(--dim); margin-right: 6px; font: inherit; }
  footer button.hit kbd { color: #444; }
  .help { color: #555; font-size: 12px; padding-bottom: 14px; }
  .done { position: absolute; text-align: center; color: var(--dim); }
  .done b { display: block; color: var(--fg); font-size: 22px; font-weight: 400; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div><b>People</b> · who is on the cover?</div>
  <div style="display:flex;gap:14px;align-items:center"><span id="prog">0 / 100</span><div class="bar"><i id="barI"></i></div><span id="tot"></span></div>
</header>
<main id="stage"></main>
<footer id="btns"></footer>
<div class="help">0 1 2 3 = number of people · 9 some human · A animal · ← or backspace undo · space skip · the model's guess is outlined</div>
<script>
// 키 = 사람 수(0 없음, 1 한 사람, 2 두 사람, 3 셋 이상), 9 일부만, A 동물
const CH = [
  ['none', 'No human', '0', 'Digit0'], ['one', 'One person', '1', 'Digit1'], ['two', 'Two people', '2', 'Digit2'],
  ['many', 'Many people', '3', 'Digit3'], ['some', 'Some human', '9', 'Digit9'], ['animal', 'Animal', 'A', 'KeyA'],
];
// 모델 판정 → 가장 가까운 선택지(힌트로 테두리만)
const GUESS = { 'No one': 'none', 'Some human': 'some', 'Big face': 'one', 'Lone figure': 'one', 'Figures': 'one', 'Couple': 'two', 'Talking heads': 'two', 'Crowd': 'many' };
const BATCH = 100;
let Q = [], k = 0, hist = [], total = 0;
const stage = document.getElementById('stage'), btns = document.getElementById('btns');
CH.forEach(([id, name], n) => {
  const b = document.createElement('button'); b.dataset.id = id;
  b.innerHTML = `<kbd>${CH[n][2]}</kbd>${name}`; b.onclick = () => choose(id); btns.appendChild(b);
});
const enc = f => encodeURIComponent(f);
function card(item, z = 0) {
  const c = document.createElement('div'); c.className = 'card';
  c.style.backgroundImage = `url("large/${enc(item.file)}")`;
  c.style.transform = `translateY(${z * 10}px) scale(${1 - z * .04})`; c.style.zIndex = 10 - z; c.style.opacity = z ? .35 : 1;
  c.innerHTML = `<div class="stamp"></div>` + (z ? '' : `<div class="meta"><b>#${item.spine}</b> · model: ${item.model || '—'}</div>`);   // 글자는 맨 앞 카드만
  return c;
}
function render() {
  stage.innerHTML = '';
  const left = Q.length - k;
  if (k >= Math.min(Q.length, BATCH) ) {
    stage.innerHTML = `<div class="done"><b>${Math.min(BATCH, k)} labeled</b>${left > 0 ? 'press enter for the next 100' : 'all covers labeled'}</div>`;
    return;
  }
  for (let z = 2; z >= 0; z--) if (Q[k + z]) stage.appendChild(card(Q[k + z], z));
  const g = GUESS[Q[k].model];
  btns.querySelectorAll('button').forEach(b => b.classList.toggle('hint', b.dataset.id === g));
  document.getElementById('prog').textContent = `${k} / ${Math.min(BATCH, Q.length)}`;
  document.getElementById('barI').style.width = `${k / Math.min(BATCH, Q.length) * 100}%`;
  document.getElementById('tot').textContent = `${total} total`;
  [1, 2, 3].forEach(z => { if (Q[k + z]) new Image().src = `large/${enc(Q[k + z].file)}`; });   // 다음 장 미리 받기
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
// 고르면: 도장이 찍히고 카드가 선택지 쪽으로 날아간다
function choose(id) {
  if (k >= Math.min(Q.length, BATCH)) return;
  const item = Q[k], top = stage.querySelector('.card:last-child');
  const n = CH.findIndex(c => c[0] === id), b = btns.querySelector(`[data-id="${id}"]`);
  b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 220);
  top.querySelector('.stamp').textContent = CH[n][1]; top.classList.add('stamped');
  const dx = (n - 2.5) * 140;   // 버튼 순서 쪽으로 날아간다
  top.style.transition = 'transform .35s var(--out), opacity .35s var(--out)';
  requestAnimationFrame(() => { top.style.transform = `translate(${dx}px, 60px) rotate(${(n - 2.5) * 4}deg) scale(.9)`; top.style.opacity = 0; });
  post('/api/label', { file: item.file, label: id, model: item.model }).then(r => { total = r.done; });
  hist.push(item); k++;
  setTimeout(render, 230);
}
function undo() {
  if (!hist.length) return;
  const item = hist.pop(); k--;
  post('/api/undo', { file: item.file }).then(r => { total = r.done; render(); });
}
function skip() { if (k < Q.length) { Q.push(Q.splice(k, 1)[0]); render(); } }
addEventListener('keydown', e => {
  const code = e.code.replace(/^Numpad(\d)$/, 'Digit$1'), hit = CH.find(c => c[3] === code);
  if (hit) { e.preventDefault(); choose(hit[0]); }
  else if (e.code === 'Backspace' || e.code === 'ArrowLeft') { e.preventDefault(); undo(); }
  else if (e.code === 'Space') { e.preventDefault(); skip(); }
  else if (e.code === 'Enter' && k >= BATCH) { load(); }
});
async function load() {
  const r = await (await fetch('/api/queue')).json();
  Q = r.queue; k = 0; hist = []; total = r.done; render();
}
load();
</script>
</body>
</html>
