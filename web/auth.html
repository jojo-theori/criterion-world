<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Signing in · The Criterion Collection World</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html { background: #000; color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; color: #8a8a8a;
    font: 14px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: center; }
  a { color: #ebebeb; }
</style>
</head>
<body>
<p id="m">Signing in…</p>
<script>
/* Google 로그인 팝업이 돌아오는 곳(redirect_uri). 주소 조각(#id_token=…&state=…)을 읽어 같은 출처의 원래 창에 넘기고 닫는다.
   토큰은 주소에서 바로 지운다. 원래 창이 state 를 확인한 뒤에만 쓴다 */
(() => {
  const p = new URLSearchParams(location.hash.slice(1));
  const msg = { type: 'ccw-auth', id_token: p.get('id_token'), state: p.get('state'), error: p.get('error') };
  history.replaceState(null, '', location.pathname);
  try { const bc = new BroadcastChannel('ccw-auth'); bc.postMessage(msg); bc.close(); } catch {}
  try { localStorage.setItem('ccw.auth.msg', JSON.stringify(msg)); setTimeout(() => localStorage.removeItem('ccw.auth.msg'), 3000); } catch {}
  setTimeout(() => {
    window.close();
    document.getElementById('m').innerHTML = msg.id_token ? 'Signed in. You can close this window.' : 'Sign-in was cancelled. <a href="/">Back to the site</a>';
  }, 400);
})();
</script>
</body>
</html>
