<html lang="en">

<style>
  :root { --fg: #ebebeb; --dim: #8a8a8a; --line: #2a2a2a; --out: cubic-bezier(.22,1,.36,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  button { font: inherit; }

  /* 두 화면이 함께 쓰는 머리줄: 축 + 원본/흔적 */
  header { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center;
    gap: 14px; padding: 0 32px; z-index: 30; }
  .group { position: relative; display: flex; gap: 2px; background: #111; border-radius: 999px; padding: 4px; }
  .group button { position: relative; z-index: 1; border: 0; background: transparent; color: var(--dim); font-size: 13px;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: color .3s var(--out); }
  .group button:not(:disabled):not(.on):hover { color: var(--fg); }
  .group button.on { color: #000; }
  .group button:disabled { opacity: .3; cursor: default; }
  .group button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .group .sep { width: 1px; margin: 6px 4px; background: #333; }
  .pill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--fg);
    transition: transform .45s var(--out), width .45s var(--out); pointer-events: none; }
  .count { font-size: 12px; color: var(--dim); margin-left: auto; transition: opacity .3s; }
  /* 눈: 누르면 기계가 본 흔적이 보인다 */
  .eye { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #111; color: var(--dim); padding: 0;
    cursor: pointer; display: grid; place-items: center; transition: background .35s var(--out), color .35s var(--out); }
  .eye:hover { color: var(--fg); }
  .eye:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .eye svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; overflow: visible; }
  .eye .pupil { fill: currentColor; stroke: none; transform-origin: 12px 12px; transition: transform .45s var(--out); }
  .eye .rays { opacity: 0; transform-origin: 12px 12px; transform: scale(.6); transition: opacity .35s var(--out), transform .5s var(--out); }
  .eye[aria-pressed="true"] { background: var(--fg); color: #000; }
  .eye[aria-pressed="true"] .pupil { transform: scale(1.55); }
  .eye[aria-pressed="true"] .rays { opacity: 1; transform: none; }
  /* 검색: 평소엔 좁게, 포커스하면 넓어진다 */
  .search { position: relative; }
  /* 쓰지 않을 때는 돋보기만 있는 동그라미로 접힌다 */
  #q { width: 36px; height: 36px; border: 0; border-radius: 999px; background: #111; color: var(--fg); cursor: pointer;
    font: inherit; font-size: 13px; padding: 0 0 0 36px; outline: none; transition: width .45s var(--out), background .2s, padding .45s var(--out); }
  #q:hover { background: #1a1a1a; }
  #q::placeholder { color: transparent; transition: color .2s; }
  .search:focus-within #q::placeholder { color: #666; }
  .search .icon { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; pointer-events: none;
    fill: none; stroke: var(--dim); stroke-width: 1.8; stroke-linecap: round; transition: stroke .2s; }
  .search:hover .icon, .search:focus-within .icon { stroke: var(--fg); }
  #q::-webkit-search-cancel-button { display: none; }
  .search .clear { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border: 0; border-radius: 50%;
    background: transparent; color: var(--dim); font-size: 16px; line-height: 24px; padding: 0; cursor: pointer;
    transition: color .2s, background .2s; }
  .search .clear:hover { color: var(--fg); background: #2a2a2a; }
  .search:not(.has):not(:focus-within) .clear { opacity: 0; pointer-events: none; }
  .search .clear { transition: color .2s, background .2s, opacity .2s; }
  #q::placeholder { color: #666; }
  #q:focus, .search.has #q { width: 280px; background: #1a1a1a; padding-right: 36px; cursor: text; }
  #results { position: absolute; right: 0; top: 44px; width: 340px; margin: 0; padding: 6px; list-style: none;
    background: #0e0e0e; border: 1px solid var(--line); border-radius: 14px; z-index: 40;
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s var(--out), transform .25s var(--out); }
  .search.open #results { opacity: 1; transform: none; pointer-events: auto; }
  #results li { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 9px; cursor: pointer; }
  #results li.on { background: #1d1d1d; }
  #results img { width: 34px; height: 42px; object-fit: cover; flex: none; background: #222; }
  #results .t { font-size: 13px; }
  #results .s { font-size: 11px; color: var(--dim); }
  #results .none { height: 120px; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--dim); font-size: 13px; cursor: default; }
  .close { border: 0; background: #111; color: var(--fg); width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 18px; opacity: 0; pointer-events: none; transform: scale(.6);
    transition: opacity .3s var(--out), transform .4s var(--out), background .2s; }
  body.tri-open .close { opacity: 1; pointer-events: auto; transform: none; }
  body.tri-open .close:hover { background: #222; transform: rotate(90deg); }
  body.tri-open .count { opacity: 0; }

  /* 격자: 캔버스 한 장 */
  #stage { position: fixed; top: 64px; left: 32px; right: 32px; bottom: 112px; }
  #grid { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; }
  #grid.hover { cursor: pointer; }
  .axis { position: absolute; font-size: 10px; color: var(--dim); white-space: nowrap; pointer-events: none;
    animation: fadeIn .6s var(--out) .45s both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  footer { position: fixed; left: 32px; bottom: 40px; right: 32px; pointer-events: none; }
  .k { font-size: 13px; color: var(--dim); }
  .v { font-size: 34px; margin-top: 2px; }

  #lens { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 9; opacity: 0;
    background-size: cover; background-position: center; outline: 1px solid var(--fg); box-shadow: 0 10px 30px rgba(0,0,0,.8);
    transition: opacity .18s var(--out), transform .22s var(--out), width .22s var(--out), height .22s var(--out); }
  #lens.show { opacity: 1; }
  #lens.jump { transition: opacity .18s var(--out); }
  #tip { position: fixed; left: 0; top: 0; pointer-events: none; background: #111; border: 1px solid var(--line);
    padding: 10px 12px; font-size: 12px; line-height: 1.5; max-width: 280px; z-index: 10;
    opacity: 0; transform: translateY(6px); transition: opacity .18s var(--out), transform .18s var(--out); }
  #tip.show { opacity: 1; transform: none; }
  #tip b { font-size: 14px; font-weight: 500; }

  /* 화면 사이를 나는 이미지 한 장 */
  #flyer { position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; display: none;
    transform-origin: 0 0; background: #0b0b0b; overflow: hidden; }
  #flyer img, #flyer canvas, #flyer div { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* 세 폭 보기 */
  #tri { position: fixed; inset: 0; background: #000; z-index: 20; visibility: hidden; opacity: 0;
    transition: opacity .35s var(--out), visibility 0s .35s; }
  #tri.open { visibility: visible; opacity: 1; transition: opacity .35s var(--out), visibility 0s; }
  #tri footer { transform: translateY(14px); transition: transform .6s var(--out); }
  #tri.open footer { transform: none; }
  /* 위·아래: 다른 클러스터로 빠지는 출구, 가운데: 세 폭 */
  /* 간격은 가로세로 모두 --gap 하나 */
  #panels { --gap: 18px; position: absolute; top: 64px; bottom: 124px; left: 0; right: 0; display: grid;
    --edge: 54px; grid-template-columns: var(--bw) var(--bw) var(--bw) var(--bw);
    grid-template-rows: var(--edgeV, var(--edge)) var(--bh) var(--edgeV, var(--edge)); align-content: center;
    gap: var(--gap); justify-content: center;
    overflow: clip; }   /* 위·아래 띠에서 출발하는 커버는 영역 밖(맨 위·맨 아래 검은 띠) 뒤에서 나온다 */
  .box { position: relative; width: var(--bw); height: var(--bh); overflow: hidden; background: #0b0b0b;
    transform-origin: 0 0; cursor: pointer; grid-row: 2; }
  .box.side:hover { outline: 1px solid var(--dim); }
  .box.side img { transition: transform .5s var(--out); }
  .box.side:hover img { transform: scale(1.03); }
  .box.landing > * { visibility: hidden; }
  .box img, .box canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .box canvas { pointer-events: none; opacity: 0; transition: opacity .5s var(--out); }
  body.trace .box canvas { opacity: 1; }
  /* 3번째 칸: 지금 커버의 상세 정보 */
  .info { grid-row: 2; grid-column: 3; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
    padding: 0 4px 2px; font-size: 14px; line-height: 1.45; color: var(--dim); }
  .info .t { font-size: 30px; line-height: 1.12; color: var(--fg); margin-bottom: 10px; }
  .info .n { font-size: 12px; margin-top: 10px; display: flex; gap: 14px; align-items: baseline; }
  .info .o { margin-top: -8px; margin-bottom: 4px; font-style: italic; }
  .info .sp { height: 10px; }
  .info .kv { display: grid; grid-template-columns: 7.5em 1fr; column-gap: 10px; font-size: 13px; line-height: 1.4; }
  .info .kv span:first-child { color: #555; }
  .info .kv span:last-child { color: #b5b5b5; }
  .info a { color: var(--dim); text-decoration: none; border-bottom: 1px solid #333; transition: color .2s, border-color .2s; }
  .info a:hover { color: var(--fg); border-color: var(--fg); }
  /* 줄 이름: 1열 왼쪽 여백에 세로로. 가운데 줄은 위 끝, 위 줄은 아래 끝, 아래 줄은 위 끝에 붙인다 */
  .rowname { grid-column: 1; position: relative; pointer-events: none; z-index: 2; }
  .rowname span { position: absolute; right: 100%; margin-right: 9px; writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: 11px; letter-spacing: .02em; white-space: nowrap; color: #555; max-height: 100%; overflow: hidden; text-overflow: ellipsis; }
  .rowname[data-row="mid"] span { bottom: auto; top: 0; color: var(--dim); }
  .rowname[data-row="up"] span { bottom: 0; }
  .rowname[data-row="down"] span { top: 0; }
  /* 오른쪽 아래 만든 이 */
  /* 만든 이: 왼쪽 아래 축 이름 밑에 한 줄 */
  #credit { position: fixed; left: 32px; bottom: 16px; z-index: 30; font-size: 11px; color: #4a4a4a; white-space: nowrap; }
  #credit i { font-style: normal; margin: 0 7px; color: #333; }
  #credit a { color: #6a6a6a; text-decoration: none; transition: color .2s; }
  #credit a:hover { color: var(--fg); }
  #credit .ver { color: #3a3a3a; font-variant-numeric: tabular-nums; }
  .peek { position: relative; overflow: hidden; cursor: pointer; opacity: .38;
    transition: opacity .3s var(--out), transform .4s var(--out); }
  .peek[data-row="up"] { grid-row: 1; }
  .peek[data-row="mid"] { grid-row: 2; }
  .peek[data-row="down"] { grid-row: 3; }
  .peek:hover { opacity: 1; }
  .peek[data-row="up"]:hover { transform: translateY(-3px); }
  .peek[data-row="down"]:hover { transform: translateY(3px); }
  /* 띠 안의 포스터는 가운데 커버와 같은 크기(--bw × --bh)이고, 안쪽 가장자리에 붙어 잘린다. 비율은 그대로 */
  .peek img, .peek canvas { position: absolute; width: var(--bw, 100%); height: var(--bh, auto); object-fit: cover; left: 0; top: 0; }
  .peek[data-row="up"] img, .peek[data-row="up"] canvas { top: auto; bottom: 0; }
  .peek canvas { opacity: 0; transition: opacity .5s var(--out); pointer-events: none; }
  body.trace .peek canvas { opacity: 1; }

  /* 단축키 팝오버 */
  #kbd { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; display: flex; align-items: center; gap: 6px;
    padding: 5px 7px 5px 10px; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 9px; font-size: 11px;
    color: var(--dim); white-space: nowrap; opacity: 0; transform: translateY(3px); transition: opacity .15s var(--out), transform .2s var(--out); }
  #kbd.show { opacity: 1; transform: none; }
  #kbd span { margin-right: 2px; }
  #kbd kbd { font: inherit; font-size: 11px; color: var(--fg); background: #2a2a2a; border-radius: 5px; padding: 1px 6px; min-width: 18px; text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important;
      animation-duration: 0s !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
<header>
  <button class="eye" id="eye" aria-pressed="false" aria-label="Machine view" data-key="space" data-tip="Machine view">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g class="rays"><path d="M12 2.2v2.3M4.6 5.2l1.6 1.6M19.4 5.2l-1.6 1.6M12 21.8v-2.3M4.6 18.8l1.6-1.6M19.4 18.8l-1.6-1.6"/></g>
      <path class="lid" d="M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6z"/>
      <circle class="pupil" cx="12" cy="12" r="2.4"/>
    </svg>
  </button>
  <div class="group" id="axes" role="group" aria-label="Axes"></div>
  <div class="count" id="count"></div>
  <div class="search" id="search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2 20 20"/></svg>
    <input id="q" type="search" placeholder="Search" data-key="f" data-tip="Search" autocomplete="off" spellcheck="false" aria-label="Search by title, director, year, country, object">
    <button class="clear" id="qClear" aria-label="Clear search" data-key="esc" data-tip="Clear">×</button>
    <ol id="results" role="listbox"></ol>
  </div>
  <button class="close" id="close" aria-label="Close" data-key="esc" data-tip="Close">×</button>
</header>
<div id="stage"><canvas id="grid" aria-label="Cover grid"></canvas></div>
<footer>
  <div class="k">Covers are sorted according to</div>
  <div class="v" id="gridName"></div>
</footer>
<div id="credit">
  <a href="https://umjo.me" target="_blank" rel="noopener">Criterion World by umjo.me</a><i>·</i>Inspired by <a href="https://www.epfl-ecal-lab.ch" target="_blank" rel="noopener">Poster World, EPFL+ECAL Lab</a><i>·</i>Not affiliated with The Criterion Collection<i>·</i><span class="ver" id="ver"></span>
</div>
<div id="tip"></div>
<div id="lens"></div>
<div id="flyer"></div>

<div id="tri" role="dialog" aria-label="Triptych">
  <div id="panels"></div>
  <footer>
    <div class="k">Neighboring covers are associated based on</div>
    <div class="v" id="triName"></div>
  </footer>
</div>

<script src="data.js"></script>
<script>
const M = window.META, C = window.COVERS, N = C.length;
// 버전: 화면·동작이 바뀌면 올린다. 데이터 날짜는 build_web.py 가 META.built 에 적는다
const VERSION = '0.1.0';
document.getElementById('ver').textContent = `v${VERSION}`;
document.getElementById('ver').title = M.built ? `data ${M.built}` : '';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const OUT = 'cubic-bezier(.22,1,.36,1)';
const GAP = 0.18, ASPECT = 1288 / 1600;

/* 축 하나가 격자 배치와 세 폭 짝을 함께 정한다 */
const AXES = {
  spine:    { label: 'Spine',      name: 'Spine' },
  year:     { label: 'Year',  name: 'Release year' },
  look:     { label: 'Look',  name: 'Overall look' },
  color:    { label: 'Color',         name: 'Color' },
  lines:    { label: 'Lines',     name: 'Composition lines' },
  text:     { label: 'Type', name: 'Typography layout' },
  contrast: { label: 'Contrast',       name: 'Contrast' },
  strokes:  { label: 'Strokes',         name: 'Strokes' },
  layout:   { label: 'Layout',   name: 'Layout' },
  objects:  { label: 'Objects',       name: 'Object recognition' },
};
const KEYS = Object.keys(AXES);
const META_AXES = new Set(['spine', 'year']);
const stem = f => f.replace(/\.jpg$/, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const has = (i, k) => META_AXES.has(k) || !!C[i].nb[k];
const ease = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

let axis = 'spine', traceOn = false, cur = null, hist = [];

/* ---------- 공통: 선택 표시, 글자 전환 ---------- */
function movePill(group, instant = false) {
  let pill = group.querySelector('.pill');
  if (!pill) { pill = document.createElement('span'); pill.className = 'pill'; group.prepend(pill); instant = true; }
  const on = group.querySelector('button.on');
  if (!on) { pill.style.width = '0px'; return; }
  if (instant) pill.style.transition = 'none';
  pill.style.width = on.offsetWidth + 'px';
  pill.style.transform = `translateX(${on.offsetLeft}px)`;
  if (instant) { pill.offsetWidth; pill.style.transition = ''; }
}
// 빠지는 애니메이션은 끝나는 즉시 지운다. fill 을 남기면 들어온 뒤 다시 투명해진다
function swapText(el, text) {
  el._target = text;
  if (RM || !el.textContent) { el.textContent = text; return; }
  if (el._busy || el.textContent === text) return;
  el._busy = true;
  const out = el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }],
    { duration: 150, easing: 'ease-in', fill: 'forwards' });
  out.onfinish = () => {
    el.textContent = el._target; out.cancel(); el._busy = false;
    el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: OUT });
  };
  out.oncancel = () => { if (el._busy) { el._busy = false; el.textContent = el._target; } };
}

/* ---------- 머리줄 ---------- */
const axesEl = document.getElementById('axes'), eyeEl = document.getElementById('eye');
KEYS.forEach((k, n) => {
  if (n === 2) { const s = document.createElement('span'); s.className = 'sep'; axesEl.appendChild(s); }
  const b = document.createElement('button');
  b.dataset.axis = k; b.textContent = AXES[k].label;
  b.dataset.key = `${(n + 1) % 10}`; b.dataset.tip = AXES[k].name;
  axesEl.appendChild(b);
});
axesEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) setAxis(b.dataset.axis); });
eyeEl.addEventListener('click', () => setTrace(!traceOn));
document.getElementById('count').textContent = `${M.count} / ${M.films}`;   // 검색 중에는 setCount 가 바꾼다

function syncAxisButtons() {
  axesEl.querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.axis === axis);
    b.disabled = cur !== null && !has(cur, b.dataset.axis);
  });
  movePill(axesEl);
}
function setAxis(k) {
  if (!AXES[k] || k === axis) return;
  axis = k;
  syncAxisButtons();
  const open = cur !== null;
  G.go(axis, !open);                     // 세 폭 보기 뒤의 격자는 조용히 옮겨 둔다
  swapText(document.getElementById('gridName'), AXES[axis].name);
  if (open) showTri({ kind: 'axis' });
  syncHash();
}
function setTrace(on) {
  traceOn = on;
  document.body.classList.toggle('trace', on);
  eyeEl.setAttribute('aria-pressed', on);
  G.mix(on ? 1 : 0);
  // 미뤄 둔 흔적을 그린다(가운데부터, 한 프레임에 하나씩)
  if (on && cur !== null) {
    const todo = [...document.querySelectorAll('#panels canvas')].filter(cv => cv._todo)
      .sort((a, b) => (b.closest('.mid') ? 1 : 0) - (a.closest('.mid') ? 1 : 0));
    const next = () => { const cv = todo.shift(); if (!cv) return; drawTrace(cv, ...cv._todo); requestAnimationFrame(next); };
    next();
  }

    el.style.gridColumn = col;
    el.innerHTML = `<img src="large/${encodeURIComponent(C[ex.j].file)}" alt="${esc(C[ex.j].title)} cover"><canvas></canvas>`;
    drawTrace(el.querySelector('canvas'), C[ex.j], axis);
    el.addEventListener('click', () => goExit(row, col));
    panels.appendChild(el);
  }));

  syncHash();
  if (RM) return;

  const midBox = panels.querySelector('.box.mid');
  if (kind === 'open' && from) {
    // 격자 타일에서 가운데로: 날아가는 동안 진짜 패널은 숨긴다
    midBox.classList.add('landing');
    G.setHidden(cur);
    fly(cur, from, midBox.getBoundingClientRect(), traceOn ? 'trace' : 'cover').then(() => midBox.classList.remove('landing'));
  } else if (from) flyWithin(midBox, from);

  /* 등장 순서는 키 배치와 같다: q w e / a (s) d / z x c, 정보 글자는 맨 끝에 한 박자 늦게.
     모든 칸이 같은 움직임(아래에서 살짝 떠오르며 나타남)과 같은 시간, 같은 간격을 쓴다.
     가운데(s)는 날아오는 중이라 순서에 자리만 차지한다 */
  const ORDER = ['up1', 'up2', 'up4', 'left', 'mid', 'right', 'down1', 'down2', 'down4'];
  const STEP = kind === 'axis' ? 28 : 45, BASE = kind === 'axis' ? 0 : kind === 'open' ? 260 : 180, DUR = kind === 'axis' ? 420 : 560;
  const rise = (el, delay, to = 1) => el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: to, transform: 'none' }],
    { duration: DUR, delay, easing: OUT, fill: 'backwards' });
  panels.querySelectorAll('.box.side, .peek').forEach(el => {
    const slot = el.classList.contains('peek') ? el.dataset.row + el.dataset.col : el.dataset.role;
    rise(el, BASE + ORDER.indexOf(slot) * STEP, +getComputedStyle(el).opacity);
  });
  panels.querySelectorAll('.rowname').forEach(el => rise(el, BASE + { up: 0, mid: 3, down: 6 }[el.dataset.row] * STEP));
  if (!from && kind !== 'axis') rise(midBox, BASE + ORDER.indexOf('mid') * STEP);   // 날아올 자리가 없을 때(뒤로 가기 등)
  if (kind !== 'axis') [...info.children].forEach((line, n) => rise(line, BASE + ORDER.length * STEP + 160 + n * 70));
}
/* 띠는 포스터를 잘라 보여준다. 날아가기 출발점은 띠가 아니라 잘린 포스터 전체(img)의 사각형이다.
   영역 밖으로 나간 부분은 #panels 의 overflow: clip 이 가린다 */
function goExit(row, col = 2) {
  const ex = exits[row]?.[col]; if (!ex) return;
  const img = panels.querySelector(`.peek[data-row="${row}"][data-col="${col}"] img`);
  openTri(ex.j, true, img ? img.getBoundingClientRect() : null);
}
function goSide(role) {
  const box = panels.querySelector(`.box.side[data-role="${role}"]`);
  if (box) box.click();
}
function closeTri() {
  if (cur === null) return;
  const i = cur, box = panels.querySelector('.box.mid');
  const land = !RM && box && G.visible(i);
  if (land) {
    // 큰 이미지에서 격자 타일로: 위층에서 날아가고, 도착하면 타일이 이어받는다
    const from = box.getBoundingClientRect();
    const content = traceOn ? box.querySelector('canvas') : 'cover';
    G.setHidden(i);
    fly(i, from, G.rect(i), content, 600).then(() => G.setHidden(-1));
  } else G.setHidden(-1);
  tri.classList.remove('open');
  document.body.classList.remove('tri-open');
  cur = null; hist = [];
  syncAxisButtons();
  syncHash();
}
document.getElementById('close').addEventListener('click', closeTri);

/* ---------- 단축키: e.code(물리 키)로 읽어 한/영 입력 상태와 무관하다 (KeyF = f, F, ㄹ) ---------- */
// 3×3 키 배치가 화면의 3×3(정보 칸 제외)과 같다: q w e / a s d / z x c
const NAV_KEYS = {
  KeyQ: () => goExit('up', 1), KeyW: () => goExit('up', 2), KeyE: () => goExit('up', 4),
  KeyA: () => goSide('left'), KeyS: () => nextAxis(), KeyD: () => goSide('right'),
  KeyZ: () => goExit('down', 1), KeyX: () => goExit('down', 2), KeyC: () => goExit('down', 4),
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target === qEl) return;
  const c = e.code;
  hideKbd();
  if (c === 'KeyF' || c === 'Slash') { e.preventDefault(); qEl.focus(); qEl.select(); return; }
  if (c === 'Space') { e.preventDefault(); setTrace(!traceOn); return; }
  const dm = c.match(/^(?:Digit|Numpad)(\d)$/);
  if (dm) {
    const k = KEYS[(+dm[1] + 9) % 10];
    if (cur === null || has(cur, k)) setAxis(k);
    return;
  }
  if (cur === null) return;
  if (c === 'Escape') closeTri();
  else if (c === 'Backspace') { e.preventDefault(); if (hist.length) openTri(hist.pop(), false); }
  else if (c === 'Enter') { e.preventDefault(); nextAxis(); }
  else if (c === 'ArrowLeft') { e.preventDefault(); goSide('left'); }
  else if (c === 'ArrowRight') { e.preventDefault(); goSide('right'); }
  else if (c === 'ArrowUp') { e.preventDefault(); goExit('up', 2); }
  else if (c === 'ArrowDown') { e.preventDefault(); goExit('down', 2); }
  else if (NAV_KEYS[c]) { e.preventDefault(); NAV_KEYS[c](); }
});

/* 0.2초 머무르면 단축키 팝오버. 대상 요소에 data-key(표시할 키), data-tip(영어 설명) */
const kbd = document.createElement('div');
kbd.id = 'kbd'; document.body.appendChild(kbd);
let kbdTimer = 0, kbdEl = null;
function hideKbd() { clearTimeout(kbdTimer); kbd.classList.remove('show'); kbdEl = null; }
function showKbd(el) {
  kbd.innerHTML = `${el.dataset.tip ? `<span>${esc(el.dataset.tip)}</span>` : ''}${el.dataset.key.split(' ').map(k => `<kbd>${esc(k)}</kbd>`).join('')}`;
  kbd.classList.add('show');
  const r = el.getBoundingClientRect(), w = kbd.offsetWidth, h = kbd.offsetHeight;
  let x = r.left + r.width / 2 - w / 2, y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = r.top - h - 8;
  if (r.height > 200) y = r.top + 12;                 // 큰 패널은 위쪽 안에
  kbd.style.left = Math.max(8, Math.min(innerWidth - w - 8, x)) + 'px';
  kbd.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest?.('[data-key]');
  if (el === kbdEl) return;
  hideKbd();
  if (!el) return;
  kbdEl = el;
  kbdTimer = setTimeout(() => { if (kbdEl === el) showKbd(el); }, 200);
});
document.addEventListener('mousedown', hideKbd);

/* ---------- 검색 ---------- */
const fold = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const HAY = C.map(c => fold([c.title, c.directors, c.countries, c.year, (c.objs || []).join(' ')].join(' ')));
const qEl = document.getElementById('q'), searchEl = document.getElementById('search'), resEl = document.getElementById('results');
let hits = [], hitOn = 0;
function runSearch() {
  const q = fold(qEl.value).trim();
  searchEl.classList.toggle('has', !!q);
  if (!q) { hits = []; G.highlight(null); renderResults(); setCount(); return; }
  const toks = q.split(/\s+/);
  const scored = [];
  C.forEach((c, i) => {
    const t = fold(c.title), h = HAY[i];
    let ok = true, score = 0;
    for (const w of toks) {
      const num = w.replace(/^#/, '');
      if (/^\d+$/.test(num) && (+num === c.spine)) { score += 100; continue; }
      if (/^\d{4}$/.test(w) && +w === c.year) { score += 40; continue; }
      if (w.startsWith('#')) { ok = false; break; }
      if (t.startsWith(w)) score += 60;
      else if (t.includes(' ' + w)) score += 45;
      else if (t.includes(w)) score += 30;
      else if (h.includes(w)) score += 10;
      else { ok = false; break; }
    }
    if (ok) scored.push([score, i]);
  });
  scored.sort((a, b) => b[0] - a[0] || C[a[1]].spine - C[b[1]].spine);
  hits = scored.map(x => x[1]); hitOn = 0;
  G.highlight(new Set(hits));
  renderResults(); setCount();
}
function setCount() {
  document.getElementById('count').textContent = qEl.value.trim() ? `${hits.length} / ${M.count}` : `${M.count} / ${M.films}`;
}
function renderResults() {
  const q = qEl.value.trim();
  searchEl.classList.toggle('open', !!q && document.activeElement === qEl);
  if (!q) { resEl.innerHTML = ''; return; }
  if (!hits.length) { resEl.innerHTML = '<li class="none">No results</li>'; return; }
  resEl.innerHTML = hits.slice(0, 8).map((i, n) => { const c = C[i]; return `<li role="option" data-i="${i}" class="${n === hitOn ? 'on' : ''}">
    <img src="thumbs/${encodeURIComponent(c.file)}" alt=""><div><div class="t">${esc(c.title)}</div><div class="s">#${c.spine} · ${c.year} · ${esc(c.directors)}</div></div></li>`; }).join('');
}
function pickResult(i) {
  if (i === undefined) return;
  qEl.blur(); searchEl.classList.remove('open');
  if (cur !== null) { openTri(i, true, null); return; }
  if (!G.visible(i)) { const k = KEYS.find(k => k !== axis && has(i, k) && (META_AXES.has(k) || C[i].g[k])); if (k) setAxis(k); }
  const from = lensOn === i && lensBox ? lensBox : G.rect(i);
  hideLens(); tip.classList.remove('show');
  openTri(i, true, from);
}
function previewResult(i) {
  if (cur !== null || i === undefined || !G.visible(i)) return;
  showLens(i);
}
qEl.addEventListener('input', runSearch);
document.getElementById('qClear').addEventListener('click', () => {
  if (qEl.value.trim()) { qEl.value = ''; runSearch(); qEl.focus(); }
  else { qEl.value = ''; runSearch(); qEl.blur(); }
});
document.getElementById('qClear').addEventListener('mousedown', e => e.preventDefault());
qEl.addEventListener('focus', () => { renderResults(); });
qEl.addEventListener('blur', () => setTimeout(() => { searchEl.classList.remove('open'); if (lensOn !== null && cur === null) hideLens(); }, 150));
qEl.addEventListener('keydown', e => {
  e.stopPropagation();
  const n = Math.min(8, hits.length);
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); hitOn = (hitOn + 1) % n; renderResults(); previewResult(hits[hitOn]); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); hitOn = (hitOn - 1 + n) % n; renderResults(); previewResult(hits[hitOn]); }
  else if (e.key === 'Enter') { e.preventDefault(); pickResult(hits[hitOn]); }
  else if (e.key === 'Escape') { if (qEl.value) { qEl.value = ''; runSearch(); } else qEl.blur(); }
});
resEl.addEventListener('mousedown', e => e.preventDefault());   // 목록을 누를 때 입력창 포커스를 잃지 않게
resEl.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) pickResult(+li.dataset.i); });
// 호버한 줄이 선택 줄이 된다(엔터·화살표도 거기서 이어진다)
resEl.addEventListener('mousemove', e => {
  const li = e.target.closest('li[data-i]'); if (!li) return;
  const n = [...resEl.children].indexOf(li);
  if (n !== hitOn) { hitOn = n; resEl.querySelectorAll('li').forEach((x, k) => x.classList.toggle('on', k === n)); }
  if (+li.dataset.i !== lensOn) previewResult(+li.dataset.i);
});

/* ---------- 주소: #<축>[,t][,tri=<spine>] ---------- */
function syncHash() {
  const parts = [axis];
  if (traceOn) parts.push('t');
  if (cur !== null) parts.push(`tri=${C[cur].spine}`);
  history.replaceState(null, '', '#' + parts.join(','));
}
function start() {
  const parts = location.hash.slice(1).split(',');
  // 예전 주소(#map, #spine,tri=2:lines:t)도 받아 준다
  const old = parts.find(p => p.startsWith('tri='))?.slice(4).split(':') || [];
  axis = AXES[old[1]] ? old[1] : AXES[parts[0]] ? parts[0] : parts[0] === 'map' ? 'look' : 'spine';
  G.size();
  G.go(axis, true, true);
  swapText(document.getElementById('gridName'), AXES[axis].name);
  syncAxisButtons(); movePill(axesEl, true);
  setTrace(parts.includes('t') || parts.includes('trace') || old[2] === 't');
  const i = old[0] ? C.findIndex(c => c.spine === +old[0]) : -1;
  if (i >= 0) openTri(i);
  G.prefetch();
}
let rz;
addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => { G.size(); G.go(axis, false); movePill(axesEl, true); if (cur !== null) triSize(); }, 60);
});
start();
</script>
</body>
</html>
